name: CI/CD Release Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Publish Release Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies & Build SPA
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Standalone Windows Executable
        run: |
          cargo build --release

      - name: Generate SHA-256 Hash
        shell: powershell
        run: |
          $hash = (Get-FileHash -Path target/release/verifgsigma.exe -Algorithm SHA256).Hash
          "$hash  verifgsigma.exe" | Out-File -Encoding ascii target/release/verifgsigma.exe.sha256
          Write-Host "Generated SHA256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/verifgsigma.exe
            target/release/verifgsigma.exe.sha256
            VerificadorGsigmaKiosk.apk
            config.json
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

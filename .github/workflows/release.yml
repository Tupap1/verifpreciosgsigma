name: CI/CD Release Builder

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Publish Release Executable & Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies & Build SPA
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Standalone Windows Executable
        run: |
          cargo build --release

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Build Inno Setup Installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss


      - name: Generate SHA-256 Hash
        shell: powershell
        run: |
          $hashExe = (Get-FileHash -Path target/release/verifgsigma.exe -Algorithm SHA256).Hash
          "$hashExe  verifgsigma.exe" | Out-File -Encoding ascii target/release/verifgsigma.exe.sha256

          $hashSetup = (Get-FileHash -Path Output/BTW-One_Verificador_Setup.exe -Algorithm SHA256).Hash
          "$hashSetup  BTW-One_Verificador_Setup.exe" | Out-File -Encoding ascii Output/BTW-One_Verificador_Setup.exe.sha256

          Write-Host "Generated Exe SHA256: $hashExe"
          Write-Host "Generated Setup SHA256: $hashSetup"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.sha) }}
          files: |
            Output/BTW-One_Verificador_Setup.exe
            Output/BTW-One_Verificador_Setup.exe.sha256
            target/release/verifgsigma.exe
            target/release/verifgsigma.exe.sha256
            VerificadorGsigmaKiosk.apk
            config.example.json

          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
